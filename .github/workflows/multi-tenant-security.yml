name: Multi-tenant security gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  api-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `prisma validate` solo resuelve `env("DATABASE_URL")` del esquema: NO
      # abre conexión. Sin la variable el paso abortaba con P1012 y el gate
      # entero quedaba en rojo en todos los PR (defecto preexistente). El valor
      # es un marcador local; no hay base de datos en el runner.
      - run: npx prisma validate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/fullpos_ci_validate
      - run: npm run audit:tenant-inventory
        working-directory: apps/api
      - run: npm run audit:endpoints
        working-directory: apps/api
      - run: npm run audit:unsafe-tenant-queries:warn
        working-directory: apps/api
      - run: npm test
        working-directory: apps/api
      - run: npm run build
        working-directory: apps/api

  flutter-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/fulltech_app
      # `pubspec.yaml` declara `.env` como asset y el fichero está en .gitignore,
      # así que en un clon limpio no existe y `flutter analyze` falla con
      # `asset_does_not_exist` (defecto preexistente). El Dockerfile de la PWA
      # hace exactamente esto antes de compilar.
      - run: cp .env.example .env
        working-directory: apps/fulltech_app
      - run: flutter analyze
        working-directory: apps/fulltech_app
      - run: flutter test
        working-directory: apps/fulltech_app
