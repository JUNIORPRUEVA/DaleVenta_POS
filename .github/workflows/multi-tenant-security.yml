name: Multi-tenant security gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  api-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
        working-directory: apps/api
      - run: npm run audit:tenant-inventory
        working-directory: apps/api
      - run: npm run audit:endpoints
        working-directory: apps/api
      - run: npm run audit:unsafe-tenant-queries:warn
        working-directory: apps/api
      - run: npm test
        working-directory: apps/api
      - run: npm run build
        working-directory: apps/api

  flutter-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/fulltech_app
      - run: flutter analyze
        working-directory: apps/fulltech_app
      - run: flutter test
        working-directory: apps/fulltech_app
