name: FullPOS hardening checks

on:
  push:
    branches:
      - fullpos-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/fulltech_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Focused hardening tests
        run: >-
          flutter test
          test/core/auth/auth_repository_login_test.dart
          test/core/lifecycle/app_lifecycle_coordinator_test.dart
          test/features/catalogo/catalog_repository_stale_test.dart
          test/features/catalogo/catalog_import_controller_test.dart
          test/features/products/inventory_product_editor_test.dart
