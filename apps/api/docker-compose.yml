version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: daleventa_pos
      POSTGRES_USER: daleventa
      POSTGRES_PASSWORD: daleventa
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    depends_on:
      - db
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/uploads
    restart: unless-stopped
    command: sh scripts/start-prod.sh

volumes:
  db_data:
  uploads_data:
