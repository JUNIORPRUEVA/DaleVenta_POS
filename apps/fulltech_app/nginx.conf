server {
  listen 80;
  server_name _;
  client_max_body_size 64m;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    font/ttf
    image/svg+xml
    text/css
    text/javascript
    text/plain;

  root /usr/share/nginx/html;
  index index.html;

  # Avoid aggressive caching for shell files so updates propagate.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.json {
    add_header Cache-Control "no-cache";
  }

  location = /assets/.env {
    add_header Cache-Control "no-cache";
  }

  location = /assets/.env.example {
    add_header Cache-Control "no-cache";
  }

  location = /env.js {
    add_header Cache-Control "no-cache";
  }

  location = /public-config.js {
    add_header Cache-Control "no-cache";
  }

  location ~* \.(js|wasm|css|ttf|png|jpg|jpeg|webp|svg)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~ ^/(support|privacy|terms|account-deletion|contact)$ {
    try_files /$1/index.html =404;
  }

  # Flutter web app (safe SPA fallback).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
