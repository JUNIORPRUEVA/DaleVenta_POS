    :root {

      --muted: #5e7187;

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--soft);
      color: var(--ink);
      font-family: "Manrope", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;

    body.has-flutter { overflow: hidden; }

      color: var(--primary-dark);

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid rgba(25, 87, 230, 0.35);
      outline-offset: 3px;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      background: var(--soft);
      pointer-events: none;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    #app-loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
    }

    .loader-logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }

    .loader-name {
      margin: 10px 0 0;
      color: var(--ink);
      font-size: 20px;
      font-weight: 900;
    }

    .loader-company {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .loader-bar {
      width: min(220px, 60vw);
      height: 4px;
      border-radius: 999px;
      background: #dfe8f2;
      overflow: hidden;
    }

    .loader-progress {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
      animation: loader-track 1.15s ease-in-out infinite;
    }

    .loader-copy {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

      width: min(760px, calc(100% - 32px));

      padding: 48px 0;

      color: #31465c;
      font-size: 15.5px;
      line-height: 1.5;
      font-weight: 600;
    }

    @keyframes loader-track {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(290%); }

    #pwa-banner {

      bottom: 16px;
      z-index: 9998;

    (function () {
      var path = window.location.pathname || '/';
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      if ((path === '/' || path === '') && search.indexOf('token=') !== -1) {
        window.history.replaceState(null, '', '/reset-password' + search);
        return;
      }

      if (hash.indexOf('#/') !== 0) {
        return;
      }

      var target = hash.substring(1);
      if (!target || target === '/') {
        return;
      }

      window.history.replaceState(null, '', target);
    })();

  <script>
    (function () {
      var initializedPixelId = '';
      var pageViewSent = false;
      var landingViewContentSent = false;

      function log(debugEnabled, message, payload) {
        if (!debugEnabled || !window.console) return;
        window.console.debug('[marketing_analytics]', message, payload || '');
      }

      function validPixelId(pixelId) {
        return typeof pixelId === 'string' && /^[0-9]{5,32}$/.test(pixelId);
      }

      function ensurePixel(pixelId, debugEnabled) {
        if (!validPixelId(pixelId)) {
          log(debugEnabled, 'META_PIXEL_ID missing or invalid');
          return false;
        }

        if (!window.fbq) {
          var n = window.fbq = function () {
            n.callMethod
              ? n.callMethod.apply(n, arguments)
              : n.queue.push(arguments);
          };
          if (!window._fbq) window._fbq = n;
          n.push = n;
          n.loaded = true;
          n.version = '2.0';
          n.queue = [];

          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://connect.facebook.net/en_US/fbevents.js';
          var firstScript = document.getElementsByTagName('script')[0];
          firstScript.parentNode.insertBefore(script, firstScript);
        }

        if (initializedPixelId !== pixelId) {
          window.fbq('init', pixelId);
          initializedPixelId = pixelId;
          pageViewSent = false;
        }

        if (!pageViewSent) {
          window.fbq('track', 'PageView');
          pageViewSent = true;
          log(debugEnabled, 'PageView', {});
        }
        return true;
      }

      window.fullposMetaPixelTrack = function (pixelId, eventName, parameters, debugEnabled) {
        try {
          if (!ensurePixel(pixelId, debugEnabled === true)) return false;
          var params = parameters && typeof parameters === 'object' ? parameters : {};
          if (eventName === 'ViewContent' && params.source_page === 'landing') {
            if (landingViewContentSent) return true;
            landingViewContentSent = true;
          }
          var standardEvents = {
            PageView: true,
            ViewContent: true,
            CompleteRegistration: true,
            Purchase: true
          };
          if (eventName === 'PageView') return true;
          window.fbq(standardEvents[eventName] ? 'track' : 'trackCustom', eventName, params);
          log(debugEnabled === true, eventName, params);
          return true;
        } catch (error) {
          log(debugEnabled === true, 'Meta Pixel blocked or unavailable', error);
          return false;
        }
      };

      function analyticsDebugEnabled() {
        var raw = String(window.MARKETING_ANALYTICS_DEBUG || '').toLowerCase();
        return raw === '1' || raw === 'true' || raw === 'yes' || raw === 'on';
      }

      if ((window.location.pathname || '/') === '/') {
        window.fullposMetaPixelTrack(
          window.META_PIXEL_ID,
          'ViewContent',
          { source_page: 'landing', content_name: 'FullPOS Cloud landing' },
          analyticsDebugEnabled()
        );
      }
    })();
  </script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('app-loader');
      document.body.classList.add('has-flutter');
      if (loader) {
        loader.classList.add('is-hidden');
        window.setTimeout(function () { loader.remove(); }, 220);
      }
    });

    (function () {
      var storageKeyPrefix = 'fulltech:pwa:';
      var installDismissKey = storageKeyPrefix + 'install-dismissed-at';
      var iosDismissKey = storageKeyPrefix + 'ios-dismissed-at';
      var updateDismissKey = storageKeyPrefix + 'update-dismissed-at';
      var installDismissWindowMs = 3 * 24 * 60 * 60 * 1000;
      var iosDismissWindowMs = 3 * 24 * 60 * 60 * 1000;
      var updateDismissWindowMs = 6 * 60 * 60 * 1000;
      var deferredInstallPrompt = null;
      var activeVariant = null;
      var updatePending = false;
      var autoReloadingForUpdate = false;
      var flutterBooted = false;
      var banner = document.getElementById('pwa-banner');
      var title = document.getElementById('pwa-banner-title');
      var copy = document.getElementById('pwa-banner-copy');
      var primaryButton = document.getElementById('pwa-banner-primary');
      var secondaryButton = document.getElementById('pwa-banner-secondary');

      if (!banner || !title || !copy || !primaryButton || !secondaryButton) return;

      function canUseStorage() {
        try {
          var key = storageKeyPrefix + 'probe';
          window.localStorage.setItem(key, '1');
          window.localStorage.removeItem(key);
          return true;
        } catch (_) {
          return false;
        }
      }

      var storageEnabled = canUseStorage();

      function readTimestamp(key) {
        if (!storageEnabled) return 0;
        var value = window.localStorage.getItem(key);
        var parsed = Number(value || '0');
        return Number.isFinite(parsed) ? parsed : 0;
      }

      function writeTimestamp(key) {
        if (storageEnabled) window.localStorage.setItem(key, String(Date.now()));
      }

      function wasRecentlyDismissed(key, windowMs) {
        var ts = readTimestamp(key);
        return ts > 0 && Date.now() - ts < windowMs;
      }

      function isStandalone() {
        return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      }

      function isIosSafari() {
        var ua = window.navigator.userAgent || '';
        return /iPad|iPhone|iPod/.test(ua) && /WebKit/.test(ua) && !/CriOS|FxiOS/.test(ua);
      }

      function isLandingRoute() {
        var path = window.location.pathname || '/';
        var hash = window.location.hash || '';
        return (path === '/' || path.endsWith('/')) && (hash === '' || hash === '#/' || hash === '#');
      }

      function hideBanner() {
        activeVariant = null;
        banner.classList.remove('is-visible');
      }

      function clearRuntimeCaches() {
        if (!('caches' in window)) return Promise.resolve();
        return window.caches.keys()
          .then(function (keys) {
            return Promise.all(keys.map(function (key) { return window.caches.delete(key); }));
          })
          .catch(function () {});
      }

      function applyUpdateNow(registration) {
        if (autoReloadingForUpdate) return;
        autoReloadingForUpdate = true;
        hideBanner();

        function reloadPage() {
          window.location.reload();
        }

        if ('serviceWorker' in window.navigator) {
          window.navigator.serviceWorker.addEventListener('controllerchange', reloadPage, { once: true });
        }

        if (registration && registration.waiting) {
          registration.waiting.postMessage('skipWaiting');
          clearRuntimeCaches().finally(function () { window.setTimeout(reloadPage, 1500); });
          return;
        }

        clearRuntimeCaches().finally(reloadPage);
      }

      function showVariant(variant) {
        if (isStandalone() && variant !== 'update') {
          hideBanner();
          return;
        }

        if (variant === 'update') {
          title.textContent = 'Hay una nueva versión de FullPOS Cloud';
          copy.textContent = 'Recarga la PWA para usar la versión más reciente y evitar shell desactualizado.';
          primaryButton.textContent = 'Actualizar ahora';
          secondaryButton.textContent = 'Luego';
        } else if (variant === 'ios-install') {
          title.textContent = 'Instala FullPOS Cloud en tu inicio';
          copy.textContent = 'En iPhone o iPad usa Compartir y luego Añadir a pantalla de inicio para abrir la app como PWA.';
          primaryButton.textContent = 'Entendido';
          secondaryButton.textContent = 'Ahora no';
        } else {
          title.textContent = 'Instala FullPOS Cloud';
          copy.textContent = 'Instala la app para abrirla como aplicación, mejorar el acceso y reducir problemas de sesión en navegador.';
          primaryButton.textContent = 'Instalar';
          secondaryButton.textContent = 'Ahora no';
        }

        activeVariant = variant;
        banner.classList.add('is-visible');
      }

      function maybeShowInstallPrompt() {
        if (!flutterBooted) return;
        if (isLandingRoute()) {
          hideBanner();
          return;
        }
        if (updatePending) {
          showVariant('update');
          return;
        }
        if (isStandalone()) {
          hideBanner();
          return;
        }
        if (deferredInstallPrompt && !wasRecentlyDismissed(installDismissKey, installDismissWindowMs)) {
          showVariant('install');
          return;
        }
        if (isIosSafari() && !wasRecentlyDismissed(iosDismissKey, iosDismissWindowMs)) {
          showVariant('ios-install');
        }
      }

      window.fulltechPwaInstall = function () {
        if (isStandalone()) {
          hideBanner();
          return false;
        }
        if (deferredInstallPrompt) {
          showVariant('install');
          return true;
        }
        if (isIosSafari()) {
          showVariant('ios-install');
          return true;
        }
        showVariant('install');
        return false;
      };

      // Read by the Flutter landing screen so the in-app sticky registration CTA
      // never overlaps this DOM banner.
      window.fulltechPwaBannerVisible = function () {
        return banner.classList.contains('is-visible');
      };

      primaryButton.addEventListener('click', function () {
        if (activeVariant === 'update') {
          window.navigator.serviceWorker.getRegistration().then(function (registration) {
            applyUpdateNow(registration);
          }).catch(function () {
            hideBanner();
            window.location.reload();
          });
          return;
        }
        if (activeVariant === 'ios-install') {
          writeTimestamp(iosDismissKey);
          hideBanner();
          return;
        }
        if (!deferredInstallPrompt) {
          hideBanner();
          return;
        }
        var promptEvent = deferredInstallPrompt;
        deferredInstallPrompt = null;
        promptEvent.prompt();
        Promise.resolve(promptEvent.userChoice)
          .then(function (choice) {
            if (!choice || choice.outcome !== 'accepted') writeTimestamp(installDismissKey);
          })
          .catch(function () { writeTimestamp(installDismissKey); })
          .finally(function () {
            hideBanner();
            window.setTimeout(maybeShowInstallPrompt, 600);
          });
      });

      secondaryButton.addEventListener('click', function () {
        if (activeVariant === 'update') writeTimestamp(updateDismissKey);
        if (activeVariant === 'ios-install') writeTimestamp(iosDismissKey);
        if (activeVariant === 'install') writeTimestamp(installDismissKey);
        hideBanner();
      });

      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        deferredInstallPrompt = event;
        window.setTimeout(maybeShowInstallPrompt, 900);
      });

      window.addEventListener('appinstalled', function () {
        deferredInstallPrompt = null;
        hideBanner();
      });

      if (window.matchMedia) {
        var standaloneQuery = window.matchMedia('(display-mode: standalone)');
        if (standaloneQuery && typeof standaloneQuery.addEventListener === 'function') {
          standaloneQuery.addEventListener('change', function () {
            if (isStandalone()) hideBanner();
            else maybeShowInstallPrompt();
          });
        }
      }

      function attachWorkerWatchers(registration) {
        if (!registration) return;

        function markUpdateAvailable() {
          if (wasRecentlyDismissed(updateDismissKey, updateDismissWindowMs)) {
            updatePending = true;
            return;
          }
          updatePending = true;
          applyUpdateNow(registration);
        }

        function watchInstalling(worker) {
          if (!worker) return;
          worker.addEventListener('statechange', function () {
            if (worker.state === 'installed' && window.navigator.serviceWorker.controller) {
              markUpdateAvailable();
            }
          });
        }

        if (registration.waiting && window.navigator.serviceWorker.controller) markUpdateAvailable();
        watchInstalling(registration.installing);
        registration.addEventListener('updatefound', function () {
          watchInstalling(registration.installing);
        });
      }

      if ('serviceWorker' in window.navigator) {
        window.navigator.serviceWorker.ready
          .then(function (registration) { attachWorkerWatchers(registration); })
          .catch(function () {});

        window.addEventListener('focus', function () {
          window.navigator.serviceWorker.getRegistration().then(function (registration) {
            if (registration && typeof registration.update === 'function') {
              registration.update().catch(function () {});
            }
          }).catch(function () {});
        });

        document.addEventListener('visibilitychange', function () {
