<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Certificación electrónica · FullPOS Cloud</title>
  <style>
    :root{
      --ink:#0b1220; --muted:#5b6474; --line:#e6e9ee; --bg:#f4f6fa;
      --brand:#1f4bd8; --ok:#0f7b52; --warn:#b54708; --radius:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
      font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      overflow:hidden}
    /* Columna a pantalla completa: encabezado fijo, lienzo flexible. Una sola
       barra de desplazamiento (la del componente), nunca la de la página. */
    body{display:flex;flex-direction:column;height:100%}
    /* Encabezado compacto propio de FullPOS */
    .top{flex:none;display:flex;align-items:center;gap:12px;
      padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
    .logo{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;
      display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.5px;flex:none}
    .marca{min-width:0}
    .marca h1{font-size:14.5px;margin:0;font-weight:650;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
    .marca p{margin:0;font-size:11.5px;color:var(--muted);white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
    .spacer{flex:1}
    .empresa{text-align:right;font-size:11.5px;color:var(--muted);line-height:1.25;min-width:0}
    .empresa b{display:block;color:var(--ink);font-size:12.5px;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;max-width:36vw}
    .ghost{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:9px;
      padding:7px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;flex:none}
    .ghost:hover{border-color:#c9cfda}
    /* Lienzo: el componente ocupa todo el alto disponible, sin scroll de página */
    main{flex:1;min-height:0;width:100%;max-width:1180px;margin:0 auto;
      padding:10px 16px 14px;display:flex;flex-direction:column;gap:10px}
    .aviso{border-radius:12px;padding:11px 14px;font-size:13px;border:1px solid}
    .aviso.info{background:#f5f7ff;border-color:#c7d2fe;color:#293a80}
    .aviso.error{background:#fef3f2;border-color:#fecdca;color:#b42318}
    .aviso.warn{background:#fff8e6;border-color:#f0dcae;color:#6b4e00}
    .oculto{display:none !important}
    #marco{flex:1;min-height:0;overflow:hidden;border:1px solid var(--line);
      border-radius:var(--radius);background:#fff}
    #wizard{display:block;width:100%;border:0;background:#fff}
    .log{display:none}
    @media (max-width:720px){
      .top{flex-wrap:wrap;padding:10px 12px;row-gap:6px}
      .empresa{text-align:left;order:3;width:100%}
      .empresa b{max-width:100%}
      .spacer{display:none}
      .ghost{order:2;margin-left:auto}
      main{padding:8px 10px 10px}
      #marco{border-radius:12px}
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="logo">FP</div>
    <div class="marca">
      <h1>Certificación electrónica</h1>
      <p>FullPOS Cloud · DGII vía DOSA</p>
    </div>
    <div class="spacer"></div>
    <div class="empresa">
      <b id="empresa-nombre">—</b>
      <span id="empresa-rnc"></span>
    </div>
    <button class="ghost" id="salir" type="button">Volver a FullPOS</button>
  </header>

  <main>
    <div class="aviso info" id="cargando">Validando tu acceso…</div>
    <div class="aviso error oculto" id="error"></div>
    <div class="aviso warn oculto" id="aviso-asistente" role="alert"></div>
    <div id="marco">
      <dosa-cert-wizard id="wizard"
        publishable-key="__DOSA_PUBLISHABLE_KEY__"
        base-url="https://dosasystem.com"
        theme="light"
        height="720" class="oculto"></dosa-cert-wizard>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      'use strict';

      var API = '__API_BASE__' || '/api';
      var CLAVE_TOKEN = 'fullpos-portal-token';

      var elCargando = document.getElementById('cargando');
      var elError = document.getElementById('error');
      var elAviso = document.getElementById('aviso-asistente');
      var elMarco = document.getElementById('marco');
      var elWizard = document.getElementById('wizard');
      var elLog = document.getElementById('log');

      function mostrar(el) { el.classList.remove('oculto'); }
      function ocultar(el) { el.classList.add('oculto'); }
      function texto(id, valor) { document.getElementById(id).textContent = valor; }

      function fallar(mensaje) {
        ocultar(elCargando);
        ocultar(elWizard);
        elError.textContent = mensaje;
        mostrar(elError);
      }

      function token() { try { return sessionStorage.getItem(CLAVE_TOKEN); } catch (e) { return null; } }
      function guardarToken(t) { try { sessionStorage.setItem(CLAVE_TOKEN, t); } catch (e) {} }
      function olvidarToken() { try { sessionStorage.removeItem(CLAVE_TOKEN); } catch (e) {} }

      function apiFetch(ruta, opciones) {
        var cfg = opciones || {};
        var headers = Object.assign({ 'Accept': 'application/json' }, cfg.headers || {});
        var t = token();
        if (t) headers['x-fullpos-portal'] = t;
        if (cfg.body) headers['Content-Type'] = 'application/json';
        return fetch(API + ruta, {
          method: cfg.method || 'GET',
          headers: headers,
          body: cfg.body ? JSON.stringify(cfg.body) : undefined,
          credentials: 'omit'
        }).then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (d) {
            return { ok: r.ok, status: r.status, data: d };
          });
        });
      }

      // El encabezado es lo único que pinta el contexto: no hay pantalla
      // intermedia. El asistente se monta justo después de validar el acceso.
      function pintarContexto(ctx) {
        var empresa = (ctx && ctx.company) || {};
        texto('empresa-nombre', empresa.commercialName || 'Mi empresa');
        var rnc = empresa.taxId ? ('RNC ' + empresa.taxId) : '';
        var p = ctx && ctx.postulation;
        var intento = p && p.attemptNo ? ('Intento ' + p.attemptNo) : '';
        texto('empresa-rnc', [rnc, intento].filter(Boolean).join(' · '));
      }

      function cargarContexto() {
        return apiFetch('/ecf/certification-portal/context').then(function (r) {
          if (!r.ok) {
            olvidarToken();
            if (r.status === 401) {
              fallar('Tu acceso al portal caducó. Vuelve a FullPOS y pulsa otra vez «Continuar con el asistente».');
            } else {
              fallar('No se pudo cargar tu expediente. Inténtalo de nuevo en un momento.');
            }
            return false;
          }
          pintarContexto(r.data.context || {});
          return true;
        }).catch(function () {
          fallar('No hay conexión con FullPOS Cloud. Revisa tu red y recarga.');
          return false;
        });
      }

      function registrar(tipo) {
        // Los eventos del navegador son pistas. Sus payloads pueden contener
        // datos fiscales; no se muestran ni se usan como autoridad.
        elLog.textContent = (elLog.textContent ? elLog.textContent + '\n' : '') + tipo;
      }

      // Alto exacto del marco disponible: el componente no arrastra su propia
      // página, así que no aparecen dos barras de desplazamiento.
      function ajustarAltura() {
        var alto = Math.floor(elMarco.getBoundingClientRect().height);
        if (alto > 0) elWizard.setAttribute('height', String(alto));
      }
      window.addEventListener('resize', ajustarAltura);
      window.addEventListener('orientationchange', ajustarAltura);

      // Monta el componente oficial. No inicia ninguna postulación: el
      // proveedor muestra su propio formulario y el usuario decide dentro.
      function montarAsistente() {
        ocultar(elCargando);
        ocultar(elError);
        ocultar(elAviso);

        if (!document.querySelector('script[data-dosa-cert="1"]')) {
          var s = document.createElement('script');
          s.src = 'https://dosasystem.com/static/embed/dosa-cert.js';
          s.async = true;
          s.setAttribute('data-dosa-cert', '1');
          s.onerror = function () {
            elAviso.textContent =
              'No se pudo cargar el asistente oficial. Revisa tu conexión y recarga la página.';
            mostrar(elAviso);
          };
          document.head.appendChild(s);
        }

        ['cert:ready','cert:step','cert:postulacion','cert:attention','cert:complete',
         'cert:error','cert:blocked','cert:asistida_pago','cert:asistida_pagada']
          .forEach(function (tipo) {
            document.addEventListener(tipo, function () {
              registrar(tipo);
              if (tipo === 'cert:ready') {
                ocultar(elAviso);
              } else if (tipo === 'cert:blocked' || tipo === 'cert:error') {
                elAviso.textContent =
                  'El asistente no está disponible aquí. Revisa que el dominio esté autorizado o ábrelo en otra pestaña si se ofrece esa opción.';
                mostrar(elAviso);
              } else if (tipo === 'cert:postulacion' || tipo === 'cert:complete') {
                // Solo se refresca el encabezado: nada se da por confirmado
                // hasta que el backend lo reporte.
                cargarContexto();
              }
            }, true);
          });

        elWizard.classList.remove('oculto');
        ajustarAltura();
      }

      document.getElementById('salir').addEventListener('click', function () {
        apiFetch('/ecf/certification-portal/sessions', { method: 'DELETE' }).finally(function () {
          olvidarToken();
          window.location.assign('/');
        });
      });

      // El ticket viene de la app, es de un solo uso y dura 120 s. Se canjea
      // aquí y se borra de la barra de direcciones: no queda en el historial.
      function canjearTicket(ticket) {
        return apiFetch('/ecf/certification-portal/sessions', {
          method: 'POST',
          body: { ticket: ticket }
        }).then(function (r) {
          if (!r.ok || !r.data.token) {
            var codigo = (r.data && r.data.message) || '';
            if (r.status === 409 || String(codigo).indexOf('ALREADY_USED') >= 0) {
              fallar('Ese enlace ya se usó. Genera uno nuevo desde FullPOS.');
            } else if (r.status === 410 || String(codigo).indexOf('EXPIRED') >= 0) {
              fallar('El enlace caducó (dura 2 minutos). Genera uno nuevo desde FullPOS.');
            } else if (r.status === 403 || String(codigo).indexOf('PILOT') >= 0) {
              fallar('El portal de certificación está en fase piloto y tu empresa todavía no está incluida. Contacta con el equipo de FullPOS.');
            } else {
              fallar('El enlace de acceso no es válido. Genera uno nuevo desde FullPOS.');
            }
            return false;
          }
          guardarToken(r.data.token);
          pintarContexto(r.data.context || {});
          return true;
        });
      }

      function limpiarUrl() {
        try {
          var u = new URL(window.location.href);
          if (u.searchParams.has('ticket')) {
            u.searchParams.delete('ticket');
            window.history.replaceState({}, '', u.pathname + (u.search ? u.search : ''));
          }
        } catch (e) { /* navegador antiguo */ }
      }

      var params = new URLSearchParams(window.location.search);
      var ticket = params.get('ticket');
      if (ticket) {
        // Un solo gesto del usuario: canjear el ticket y montar el asistente
        // en la misma pantalla, sin clic adicional.
        limpiarUrl();
        canjearTicket(ticket).then(function (ok) {
          if (ok) montarAsistente();
        });
      } else if (token()) {
        // Recarga o vuelta atrás con sesión de portal vigente: se reanuda
        // montando el asistente, sin pedir el ticket otra vez.
        cargarContexto().then(function (ok) {
          if (ok) montarAsistente();
        });
      } else {
        fallar('Falta el enlace de acceso. Abre el portal desde FullPOS Cloud, en Configuración → Facturación electrónica.');
      }
    })();
  </script>
</body>
</html>
