# Pre-compressed main.dart.js is requested with a per-deploy version query
# (see the BUILD_ID step in the Dockerfile), so a versioned URL can be cached
# immutably while an unversioned one keeps revalidating.
map $arg_v $main_dart_js_cache {
  default "public, max-age=31536000, immutable";
  ""      "no-cache";
}

# Login handoff and password recovery tickets must not enter access logs.
map "$arg_handoff$arg_token" $fullpos_log_request {
  default 0;
  ""      1;
}
