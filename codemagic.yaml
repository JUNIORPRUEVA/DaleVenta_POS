workflows:
  ios-release-no-codesign:
    name: iOS Release Build (No Codesign)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      vars:
        APP_DIR: apps/fulltech_app
        BUNDLE_ID: com.fulltechrd.fullposcloud
    scripts:
      - name: Flutter clean
        script: |
          cd "$APP_DIR"
          flutter clean
      - name: Flutter pub get
        script: |
          cd "$APP_DIR"
          flutter pub get
      - name: Static analysis
        script: |
          cd "$APP_DIR"
          flutter analyze || true
      - name: Build iOS release without codesign
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$APP_DIR"

          # Marketing version always comes from pubspec.yaml (canonical source).
          IOS_BUILD_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          IOS_BUILD_NUMBER="$(date +%Y%m%d%H%M%S)"

          echo "iOS marketing version (pubspec.yaml): $IOS_BUILD_NAME"
          echo "iOS build number: $IOS_BUILD_NUMBER"

          # Export signing overrides so xcodebuild subprocess inherits them.
          # This overrides project-level "CODE_SIGN_IDENTITY[sdk=iphoneos*]" and
          # VALIDATE_PRODUCT = YES which otherwise force signing even with --no-codesign.
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""
          export EXPANDED_CODE_SIGN_IDENTITY=""

          echo "== flutter build ios --release --no-codesign =="
          flutter build ios \
            --release \
            --no-codesign \
            --build-name="$IOS_BUILD_NAME" \
            --build-number="$IOS_BUILD_NUMBER"

          echo "== Packaging unsigned IPA =="
          cd build/ios/iphoneos

          rm -rf Payload Runner-no-codesign.ipa

          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry Runner-no-codesign.ipa Payload

          echo "Unsigned IPA created:"
          ls -lah Runner-no-codesign.ipa
    artifacts:
      - apps/fulltech_app/build/ios/iphoneos/Runner-no-codesign.ipa
      - apps/fulltech_app/build/ios/iphoneos/Runner.app

  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CodemagicKey
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fulltechrd.fullposcloud
      vars:
        APP_DIR: apps/fulltech_app
        BUNDLE_ID: com.fulltechrd.fullposcloud
        APPLE_TEAM_ID: M4WNZDXN2U
        # App Store Connect floor. Version trains 1.0.3 and 1.0.5 are closed, so any
        # build below these values is rejected on import ("Invalid Pre-Release Train" /
        # "Invalid Version"). Raise these only together with the matching pubspec bump.
        IOS_MIN_MARKETING_VERSION: 1.0.6
        IOS_MIN_BUILD_NUMBER: 130
    scripts:
      - name: Create CI env file
        script: |
          cd "$APP_DIR"
          ENV_FILE=".env"
          API_BASE_URL_VALUE="${API_BASE_URL:-https://daleventapos-backend.gcdndd.easypanel.host}"
          APP_BASE_URL_VALUE="${APP_BASE_URL:-$API_BASE_URL_VALUE}"
          API_TIMEOUT_MS_VALUE="${API_TIMEOUT_MS:-15000}"

          {
            echo "APP_ENV=production"
            echo "API_BASE_URL=$API_BASE_URL_VALUE"
            echo "APP_BASE_URL=$APP_BASE_URL_VALUE"
            echo "API_TIMEOUT_MS=$API_TIMEOUT_MS_VALUE"
            if [ -n "${QUOTATION_APPROVAL_ADMIN_PHONE:-}" ]; then
              echo "QUOTATION_APPROVAL_ADMIN_PHONE=$QUOTATION_APPROVAL_ADMIN_PHONE"
            fi
            if [ -n "${RELEASES_API_BASE_URL:-}" ]; then
              echo "RELEASES_API_BASE_URL=$RELEASES_API_BASE_URL"
            fi
            if [ -n "${RELEASES_API_KEY:-}" ]; then
              echo "RELEASES_API_KEY=$RELEASES_API_KEY"
            fi
          } > "$ENV_FILE"
      - name: Flutter pub get
        script: |
          cd "$APP_DIR"
          flutter pub get
      - name: Static analysis
        script: |
          cd "$APP_DIR"
          flutter analyze
      - name: Unit and widget tests
        script: |
          cd "$APP_DIR"
          flutter test test/features/account/account_settings_navigation_test.dart \
            -r expanded \
            --concurrency=1
      - name: Apply Xcode signing settings
        script: |
          cd "$APP_DIR"
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd "$APP_DIR"
          set -euo pipefail

          # Numeric-aware "a >= b" comparison for x.y.z (BSD awk on macOS, no sort -V).
          version_ge() {
            awk -v a="$1" -v b="$2" 'BEGIN {
              na = split(a, A, ".");
              nb = split(b, B, ".");
              for (i = 1; i <= 3; i++) {
                ai = (i <= na ? A[i] + 0 : 0);
                bi = (i <= nb ? B[i] + 0 : 0);
                if (ai > bi) exit 0;
                if (ai < bi) exit 1;
              }
              exit 0;
            }'
          }

          # Canonical version source: apps/fulltech_app/pubspec.yaml.
          BUILD_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          BUILD_NAME=${BUILD_VERSION%+*}
          PUBSPEC_BUILD_NUMBER=${BUILD_VERSION#*+}

          case "$PUBSPEC_BUILD_NUMBER" in
            ''|*[!0-9]*)
              echo "pubspec.yaml build number must be numeric, got: $PUBSPEC_BUILD_NUMBER"
              exit 1
              ;;
          esac

          # Never regenerate a version train that App Store Connect already closed.
          if ! version_ge "$BUILD_NAME" "$IOS_MIN_MARKETING_VERSION"; then
            echo "iOS marketing version $BUILD_NAME is lower than IOS_MIN_MARKETING_VERSION=$IOS_MIN_MARKETING_VERSION."
            echo "Raise 'version:' in apps/fulltech_app/pubspec.yaml before building."
            exit 1
          fi

          CODEMAGIC_PROJECT_BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-0}"
          case "$CODEMAGIC_PROJECT_BUILD_NUMBER" in
            ''|*[!0-9]*)
              echo "PROJECT_BUILD_NUMBER must be numeric, got: $CODEMAGIC_PROJECT_BUILD_NUMBER"
              exit 1
              ;;
          esac

          IOS_BUILD_NUMBER=$((CODEMAGIC_PROJECT_BUILD_NUMBER + 100))
          if [ "$PUBSPEC_BUILD_NUMBER" -gt "$IOS_BUILD_NUMBER" ]; then
            IOS_BUILD_NUMBER="$PUBSPEC_BUILD_NUMBER"
          fi
          if [ "$IOS_BUILD_NUMBER" -lt "$IOS_MIN_BUILD_NUMBER" ]; then
            echo "iOS build number $IOS_BUILD_NUMBER is lower than IOS_MIN_BUILD_NUMBER=$IOS_MIN_BUILD_NUMBER (App Store Connect floor)."
            exit 1
          fi

          echo "Codemagic BUILD_NUMBER: ${BUILD_NUMBER:-unset}"
          echo "Codemagic PROJECT_BUILD_NUMBER: ${PROJECT_BUILD_NUMBER:-unset}"
          echo "iOS version (pubspec.yaml): $BUILD_NAME"
          echo "iOS build number: $IOS_BUILD_NUMBER"

          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$IOS_BUILD_NUMBER" \
            --export-options-plist=ios/ExportOptions.plist

          ARCHIVE_INFO_PLIST="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Info.plist"
          ARCHIVE_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$ARCHIVE_INFO_PLIST")
          ARCHIVE_BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$ARCHIVE_INFO_PLIST")
          echo "Archive iOS version: $ARCHIVE_VERSION"
          echo "Archive iOS build number: $ARCHIVE_BUILD_NUMBER"

          if [ "$ARCHIVE_VERSION" != "$BUILD_NAME" ]; then
            echo "Archive CFBundleShortVersionString ($ARCHIVE_VERSION) does not match pubspec.yaml version ($BUILD_NAME)"
            exit 1
          fi
          if [ "$ARCHIVE_BUILD_NUMBER" != "$IOS_BUILD_NUMBER" ]; then
            echo "Archive CFBundleVersion ($ARCHIVE_BUILD_NUMBER) does not match IOS_BUILD_NUMBER ($IOS_BUILD_NUMBER)"
            exit 1
          fi
          if [ "$ARCHIVE_BUILD_NUMBER" -lt "$IOS_MIN_BUILD_NUMBER" ]; then
            echo "Archive CFBundleVersion must be >= IOS_MIN_BUILD_NUMBER=$IOS_MIN_BUILD_NUMBER (App Store Connect floor)"
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"
          cp build/ios/ipa/*.ipa "$CM_BUILD_DIR/build/ios/ipa/"
    artifacts:
      - build/ios/ipa/*.ipa
      - apps/fulltech_app/build/ios/archive/Runner.xcarchive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
