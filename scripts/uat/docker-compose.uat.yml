services:
  offline_safe_48h_postgres:
    image: postgres:16-alpine
    container_name: fullpos_offline_safe_48h_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${UAT_DB_NAME:?UAT_DB_NAME is required}
      POSTGRES_USER: ${UAT_DB_USER:?UAT_DB_USER is required}
      POSTGRES_PASSWORD: ${UAT_DB_PASSWORD:?UAT_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${UAT_DB_PORT:-56548}:5432"
    volumes:
      - fullpos_offline_safe_48h_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UAT_DB_USER} -d ${UAT_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fullpos_offline_safe_48h_postgres_data:
